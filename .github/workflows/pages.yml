name: Publish Open Preview Gallery

on:
  push:
    branches: ["main"]
    paths:
      - "public/showcase/**"
      - "scripts/verify-showcase.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify static showcase
        run: node scripts/verify-showcase.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload gallery artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
